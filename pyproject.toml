[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wc26"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "networkx>=3.3",
    "structlog>=24.0",
    "typer>=0.12",
    "rapidfuzz>=3.9",
]

[project.scripts]
wc26 = "wc26.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wc26"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/wc26 --cov-report=term-missing"
